name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  release:
    types: [ published ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Sync Python sources and item index
        run: python android/sync_python.py

      - name: Prepare release signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        if: env.SIGNED_RELEASE != 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Build signed release APK
        if: env.SIGNED_RELEASE == 'true'
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Pig-Management-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
